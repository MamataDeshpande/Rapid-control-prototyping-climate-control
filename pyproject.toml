[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rapid-climate-control-simulator"
version = "0.1.0"
description = "Original educational automotive HVAC control and diagnostic simulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Portfolio demonstration"}]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7,<4"]

[project.scripts]
rcp-demo = "rcp_hvac.cli:main"

[tool.setuptools.packages.find]
include = ["rcp_hvac*"]
